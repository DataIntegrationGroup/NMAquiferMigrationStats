# ============================================================
# migration_verifier/config.yaml
# ============================================================
# Both source and target run on Cloud SQL, connected via the
# Cloud SQL Python Connector.  No raw DSN strings needed.
#
# DO NOT commit the filled copy to source control.
# Commit this template instead.
# ============================================================


# ── Source: Cloud SQL SQL Server ─────────────────────────────
# SQL Server on Cloud SQL does NOT support IAM database auth,
# so a regular username + password is still required here.
# However, the connector handles the secure tunnel automatically
# (no SSL certs, no firewall rules, no Auth Proxy process needed).
#
# Find your instance connection name in:
#   Cloud Console → SQL → your instance → Overview → "Connection name"
#   Format is always:  project-id:region:instance-name
cloud_sql_source:
  instance_connection_name: "waterdatainitiative-271000:us-west4:nm-aquifer-clone"
  database: "NM_Aquifer_Dev_DB"          # your source DB name
  user:     "sqlserver"      # SQL Server login username
  password: "ilikewaterdata!!"      # SQL Server login password
  ip_type:  "public"             # "public" or "private" (VPC)

source_label: "NMAquifer SQL Server (legacy)"
source_schema: "dbo"             # SQL Server schema, usually "dbo"


# ── Target: Cloud SQL PostgreSQL (IAM auth) ──────────────────
# Postgres on Cloud SQL supports IAM database authentication.
# No password needed — the connector uses your gcloud ADC creds.
#
# Prerequisites:
#   1. Run:  gcloud auth application-default login
#   2. In Cloud SQL Console → Users → Add IAM user → add your email
#      (this is separate from the GCP IAM role — both are required)
#   3. Your account needs the "Cloud SQL Client" IAM role on the project
#
# iam_user should match exactly what you use with gcloud, e.g.:
#   - Personal account:    "your.name@domain.com"
#   - Service account:     "my-sa@my-project.iam.gserviceaccount.com"
cloud_sql_target:
  instance_connection_name: "waterdatainitiative-271000:us-west4:dataservices"
  database: "ocotillo-staging"     # your target DB name
  iam_user: "marissa.fichera@nmt.edu"
  ip_type:  "public"             # "public" or "private" (VPC)

target_label: "PostgreSQL (new)"
target_schema: "public"          # Postgres schema, usually "public"


# ── Fallback plain DSNs ──────────────────────────────────────
# Only used if the cloud_sql_source / cloud_sql_target blocks
# above are absent or commented out.  Useful for local SQLite
# testing or non-Cloud-SQL databases.
#
# source_dsn: "mssql+pyodbc://user:pass@host/db?driver=ODBC+Driver+17+for+SQL+Server"
# target_dsn: "postgresql+psycopg2://user:pass@host:5432/db"


# ── Anchor table ─────────────────────────────────────────────
anchor_table: "Location"           # table that directly holds pointID
anchor_pk:    "PointID"          # the pointID column name in that table

# Target schema has a different anchor table/PK.
# All target-side joins resolve back to this table/column instead.
target_anchor_table: "thing"
target_anchor_pk:    "name"


# ── Google Sheets mapping ────────────────────────────────────
# Live pull on every run — always uses latest version of the sheet.
# Share the sheet with the service account email (Viewer access).
#
# Spreadsheet ID is the long string in the sheet URL:
#   docs.google.com/spreadsheets/d/<SPREADSHEET_ID>/edit
google_sheets:
  service_account_file: "./service_account.json"
  spreadsheet_id: "1NtkaSWh8COQpMXd9AZ-fXMsRok9l-wwC1sz0lgVCTeo"
  range: "MIGRATION_STATUS!A:E"            # adjust tab name / column range if needed

# CSV fallback (ignored if google_sheets.spreadsheet_id is set)
# mapping_csv: "./mapping_export.csv"


# ── Transformed fields ───────────────────────────────────────
# Fields that went through a transformation during migration
# (concat, split, reformat, computed values, etc.).
# These are flagged "Manual Review Required" — values not compared.
# Format: "old_table.old_field"  (matches NMAquifer_TableField column)
transformed_fields:
  - "old_table.some_transformed_field"
  - "another_table.computed_column"


# ── Unmapped column enforcement ──────────────────────────────
# true  = columns in the DB with no mapping row are reported as errors
# false = silently skip them (useful during early/partial migration)
check_unmapped_source: true
check_unmapped_target: true

# ── Manual FK paths ──────────────────────────────────────────
# Used when FK constraints exist in the DB but SQLAlchemy's reflection
# can't traverse them (e.g. table names with spaces break reflection).
# Also useful for tables with no FK constraints at all.
#
# Format: one entry per source table that can't be auto-resolved.
# Hops are listed in order from the start table toward the anchor.
# The BFS is skipped entirely for any table listed here.
#
# source: paths for the legacy SQL Server side
# target: paths for the new PostgreSQL side (usually not needed)
manual_fk_paths:
  source:
    MinorandTraceChemistry:
      - { from_table: "MinorandTraceChemistry", from_col: "SamplePtID",  to_table: "Chemistry SampleInfo", to_col: "SamplePtID" }
      - { from_table: "Chemistry SampleInfo",   from_col: "LocationId",  to_table: "Location",             to_col: "LocationId" }
    MajorChemistry:
      - { from_table: "MajorChemistry",         from_col: "SamplePtID",  to_table: "Chemistry SampleInfo", to_col: "SamplePtID" }
      - { from_table: "Chemistry SampleInfo",   from_col: "LocationId",  to_table: "Location",             to_col: "LocationId" }
    Radionuclides:
      - { from_table: "Radionuclides",          from_col: "SamplePtID",  to_table: "Chemistry SampleInfo", to_col: "SamplePtID" }
      - { from_table: "Chemistry SampleInfo",   from_col: "LocationId",  to_table: "Location",             to_col: "LocationId" }
    FieldParameters:
      - { from_table: "FieldParameters",        from_col: "SamplePtID",  to_table: "Chemistry SampleInfo", to_col: "SamplePtID" }
      - { from_table: "Chemistry SampleInfo",   from_col: "LocationId",  to_table: "Location",             to_col: "LocationId" }
    "Chemistry SampleInfo":
      - { from_table: "Chemistry SampleInfo",   from_col: "LocationId",  to_table: "Location",             to_col: "LocationId" }
    WellData:
      - { from_table: "WellData",               from_col: "LocationId",  to_table: "Location",             to_col: "LocationId" }
    WellScreens:
      - { from_table: "WellScreens",              from_col: "WellID",                  to_table: "WellData",                 to_col: "WellID" }
      - { from_table: "WellData",                 from_col: "LocationId",              to_table: "Location",                 to_col: "LocationId" }
  target:
    NMA_AssociatedData:
      - { from_table: "NMA_AssociatedData", from_col: "thing_id", to_table: "thing", to_col: "id" }
    NMA_Chemistry_SampleInfo:
