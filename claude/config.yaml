# ── Tables to skip entirely ──────────────────────────────────
# Source table prefixes to skip — lookup/reference tables that don't
# have per-pointID data and can't join back to the anchor table.
# LU_ tables are the legacy SQL Server lookup tables (now lexicon_term).
exclude_source_prefixes:
  - "LU_"

exclude_tables:
  - "audit_log"
  - "migration_staging"
  - "schema_migrations"
  - "sysdiagrams"                # SQL Server internal table


# ── Point IDs ────────────────────────────────────────────────
# Inline list, or use --point-ids-file on the CLI (takes precedence)
point_ids:
  - 1001
  - 1002
  - 1003


# ── Diff settings ────────────────────────────────────────────
max_diff_rows: 200               # max captured diffs per field per pointID
