    NMA_FieldParameters:
      - { from_table: "NMA_FieldParameters", from_col: "chemistry_sample_info_id", to_table: "NMA_Chemistry_SampleInfo", to_col: "id" }
      - { from_table: "NMA_Chemistry_SampleInfo", from_col: "thing_id", to_table: "thing", to_col: "id" }
    NMA_HydraulicsData:
      - { from_table: "NMA_HydraulicsData", from_col: "thing_id", to_table: "thing", to_col: "id" }
    NMA_MajorChemistry:
      - { from_table: "NMA_MajorChemistry", from_col: "chemistry_sample_info_id", to_table: "NMA_Chemistry_SampleInfo", to_col: "id" }
      - { from_table: "NMA_Chemistry_SampleInfo", from_col: "thing_id", to_table: "thing", to_col: "id" }
    NMA_MinorTraceChemistry:
      - { from_table: "NMA_MinorTraceChemistry", from_col: "chemistry_sample_info_id", to_table: "NMA_Chemistry_SampleInfo", to_col: "id" }
      - { from_table: "NMA_Chemistry_SampleInfo", from_col: "thing_id", to_table: "thing", to_col: "id" }
    NMA_Radionuclides:
      - { from_table: "NMA_Radionuclides", from_col: "chemistry_sample_info_id", to_table: "NMA_Chemistry_SampleInfo", to_col: "id" }
      - { from_table: "NMA_Chemistry_SampleInfo", from_col: "thing_id", to_table: "thing", to_col: "id" }
    NMA_Soil_Rock_Results:
      - { from_table: "NMA_Soil_Rock_Results", from_col: "thing_id", to_table: "thing", to_col: "id" }
    NMA_Stratigraphy:
      - { from_table: "NMA_Stratigraphy", from_col: "thing_id", to_table: "thing", to_col: "id" }
    NMA_SurfaceWaterData:
      - { from_table: "NMA_SurfaceWaterData", from_col: "thing_id", to_table: "thing", to_col: "id" }
    NMA_WaterLevelsContinuous_Pressure_Daily:
